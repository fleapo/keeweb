# #
#   @type           github workflow
#   @author         Modified from KeeWeb
#   @project        KeeWeb (Custom Build)
#   @usage          Build keeweb releases for win.x64.exe and mac.arm64.dmg only
# #

name: '🔨 Build › Run'
run-name: '🔨 Deploy › Run'

# #
#   Triggers
# #

on:

    # #
    #   Trigger › Push
    # #

    push:
        tags: [ '*' ]

# #
#   Environment Vars
# #

env:
    NODE_OPTIONS: '--openssl-legacy-provider'

# #
#   Jobs
# #

jobs:

    # #
    #   Job › Build › Web
    # #

    web:
        runs-on: ubuntu-latest
        steps:

            - name: 'Get current git tag'
              id: get_tag
              uses: keeweb/get-git-tag@v3.0.2
              with:
                  tagRegex: "^v(\\d+\\.\\d+\\.\\d+)$"
                  tagRegexGroup: 1

            - name: 'Checkout'
              uses: actions/checkout@v4

            - name: 'Upgrade Node.js'
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  registry-url: 'https://registry.npmjs.org'

            - name: 'Install npm modules'
              run: |
                  npm ci

            - name: 'Test'
              run: |
                  npm test

            - name: 'Grunt'
              run: |
                  grunt

            - name: 'Upload artifact'
              uses: actions/upload-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.html
                  path: dist

    # #
    #   Job › Build › Darwin (macOS) - arm64 only
    # #

    darwin:
        runs-on: macos-latest
        needs:
            - web
        steps:

            - name: 'Get current git tag'
              id: get_tag
              uses: keeweb/get-git-tag@v3.0.2
              with:
                  tagRegex: "^v(\\d+\\.\\d+\\.\\d+)$"
                  tagRegexGroup: 1

            - name: 'Checkout'
              uses: actions/checkout@v4

            - name: 'Download artifact'
              uses: actions/download-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.html
                  path: dist

            - name: 'Upgrade Node.js'
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  registry-url: 'https://registry.npmjs.org'

            - name: 'Install npm modules'
              run: |
                  npm ci

            - name: 'Install grunt'
              run: |
                  sudo npm i -g grunt-cli

            - name: 'Grunt'
              run: |
                  grunt --max-old-space-size=4096 desktop-darwin --skip-sign

            - name: 'Upload arm64 dmg artifact'
              uses: actions/upload-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.mac.arm64.dmg
                  path: dist/desktop/KeeWeb-${{ steps.get_tag.outputs.tag }}.mac.arm64.dmg

    # #
    #   Job › Build › Win32 - x64 only
    # #

    win32:
        runs-on: windows-latest
        needs:
            - web
        steps:

            - name: 'Get current git tag'
              id: get_tag
              uses: keeweb/get-git-tag@v3.0.2
              with:
                  tagRegex: "^v(\\d+\\.\\d+\\.\\d+)$"
                  tagRegexGroup: 1

            - name: 'Checkout'
              uses: actions/checkout@v4

            - name: 'Download artifact'
              uses: actions/download-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.html
                  path: dist

            - name: 'Upgrade Node.js'
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  registry-url: 'https://registry.npmjs.org'

            - name: 'Install npm modules'
              run: |
                  npm ci

            - name: 'Install grunt'
              run: |
                  npm i -g grunt-cli

            - name: 'Grunt'
              run: |
                  grunt desktop-win32 --skip-sign

            - name: 'Upload x64 exe artifact'
              uses: actions/upload-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.win.x64.exe
                  path: dist/desktop/KeeWeb-${{ steps.get_tag.outputs.tag }}.win.x64.exe

    # #
    #   Job › Create GitHub Release
    # #

    publish:
        runs-on: ubuntu-latest
        needs:
            - darwin
            - win32
        steps:
            - name: 'Get current git tag'
              id: get_tag
              uses: keeweb/get-git-tag@v3.0.2
              with:
                  tagRegex: "^v(\\d+\\.\\d+\\.\\d+)$"
                  tagRegexGroup: 1

            - name: 'Download darwin.arm64.dmg artifact'
              uses: actions/download-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.mac.arm64.dmg
                  path: assets

            - name: 'Download win32.x64.exe artifact'
              uses: actions/download-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.win.x64.exe
                  path: assets

            - name: 'Publish GitHub release'
              uses: softprops/action-gh-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: v${{ steps.get_tag.outputs.tag }}
                  name: Desktop apps v${{ steps.get_tag.outputs.tag }}
                  files: assets/*
                  body: |
                      ## Custom Build
                      This is a custom build with the Last-Modified header check removed for WebDAV compatibility.

                      ### Downloads
                      - Windows x64: `KeeWeb-${{ steps.get_tag.outputs.tag }}.win.x64.exe`
                      - macOS arm64: `KeeWeb-${{ steps.get_tag.outputs.tag }}.mac.arm64.dmg`

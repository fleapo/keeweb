# #
#   @type           github workflow
#   @author         Modified from KeeWeb
#   @project        KeeWeb (Custom Build)
#   @usage          Build keeweb releases for win.x64.exe and mac.arm64.dmg only
# #

name: '🔨 Build › Run'
run-name: '🔨 Deploy › Run'

# #
#   Triggers
# #

on:

    # #
    #   Trigger › Push
    # #

    push:
        tags: [ '*' ]

# #
#   Jobs
# #

jobs:

    # #
    #   Job › Build › Web
    # #

    web:
        runs-on: ubuntu-latest
        steps:

            - name: 'Get current git tag'
              id: get_tag
              uses: keeweb/get-git-tag@v3.0.2
              with:
                  tagRegex: "^v(\\d+\\.\\d+\\.\\d+)$"
                  tagRegexGroup: 1

            - name: 'Checkout'
              uses: actions/checkout@v4

            - name: 'Upgrade Node.js'
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  registry-url: 'https://registry.npmjs.org'

            - name: 'Install npm modules'
              run: |
                  npm ci

            - name: 'Test'
              env:
                  NODE_OPTIONS: '--openssl-legacy-provider'
              run: |
                  npm test

            - name: 'Grunt'
              env:
                  NODE_OPTIONS: '--openssl-legacy-provider'
              run: |
                  grunt

            - name: 'Upload artifact'
              uses: actions/upload-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.html
                  path: dist

    # #
    #   Job › Build › Darwin (macOS) - arm64 only
    # #

    darwin:
        runs-on: macos-latest
        needs:
            - web
        steps:

            - name: 'Get current git tag'
              id: get_tag
              uses: keeweb/get-git-tag@v3.0.2
              with:
                  tagRegex: "^v(\\d+\\.\\d+\\.\\d+)$"
                  tagRegexGroup: 1

            - name: 'Checkout'
              uses: actions/checkout@v4

            - name: 'Download artifact'
              uses: actions/download-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.html
                  path: dist

            - name: 'Upgrade Node.js'
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  registry-url: 'https://registry.npmjs.org'

            - name: 'Install npm modules'
              run: |
                  npm ci

            - name: 'Install grunt'
              run: |
                  sudo npm i -g grunt-cli

            - name: 'Grunt'
              run: |
                  grunt --max-old-space-size=4096 desktop-darwin --skip-sign

            - name: 'Create DMG with hdiutil'
              run: |
                  mkdir -p dist/desktop
                  # Create a temporary DMG
                  hdiutil create -volname "KeeWeb" -srcfolder tmp/desktop/KeeWeb-darwin-arm64/KeeWeb.app -ov -format UDZO dist/desktop/KeeWeb-${{ steps.get_tag.outputs.tag }}.mac.arm64.dmg

            - name: 'Upload arm64 dmg artifact'
              uses: actions/upload-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.mac.arm64.dmg
                  path: dist/desktop/KeeWeb-${{ steps.get_tag.outputs.tag }}.mac.arm64.dmg

    # #
    #   Job › Build › Win32 - x64 only
    # #

    win32:
        runs-on: windows-latest
        needs:
            - web
        steps:

            - name: 'Get current git tag'
              id: get_tag
              uses: keeweb/get-git-tag@v3.0.2
              with:
                  tagRegex: "^v(\\d+\\.\\d+\\.\\d+)$"
                  tagRegexGroup: 1

            - name: 'Checkout'
              uses: actions/checkout@v4

            - name: 'Download artifact'
              uses: actions/download-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.html
                  path: dist

            - name: 'Upgrade Node.js'
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  registry-url: 'https://registry.npmjs.org'

            - name: 'Install npm modules'
              run: |
                  npm ci

            - name: 'Install grunt'
              run: |
                  npm i -g grunt-cli

            - name: 'Debug Environment Info'
              run: |
                  echo "============================================"
                  echo "=== DEBUG: Environment Information ==="
                  echo "============================================"
                  echo ""
                  echo "=== Node.js Version ==="
                  node --version
                  echo ""
                  echo "=== NPM Version ==="
                  npm --version
                  echo ""
                  echo "=== Grunt CLI Version ==="
                  grunt --version
                  echo ""
                  echo "=== process.execArgv ==="
                  node -e "console.log('process.execArgv:', JSON.stringify(process.execArgv))"
                  echo ""
                  echo "=== process.argv ==="
                  node -e "console.log('process.argv:', JSON.stringify(process.argv))"
                  echo ""
                  echo "=== NODE_OPTIONS environment variable ==="
                  echo "NODE_OPTIONS: $env:NODE_OPTIONS"
                  echo ""
                  echo "=== NODE_DEBUG environment variable ==="
                  echo "NODE_DEBUG: $env:NODE_DEBUG"
                  echo ""
                  echo "=== All NODE_* environment variables ==="
                  Get-ChildItem env: | Where-Object { $_.Name -like "NODE*" } | Format-Table -AutoSize
                  echo ""
                  echo "=== nopt version (project local) ==="
                  node -e "try { console.log(require('./node_modules/nopt/package.json').version) } catch(e) { console.log('Not found:', e.message) }"
                  echo ""
                  echo "=== grunt version (project local) ==="
                  node -e "try { console.log(require('./node_modules/grunt/package.json').version) } catch(e) { console.log('Not found:', e.message) }"
                  echo ""
                  echo "=== grunt-legacy-util version ==="
                  node -e "try { console.log(require('./node_modules/grunt-legacy-util/package.json').version) } catch(e) { console.log('Not found:', e.message) }"
                  echo ""
                  echo "=== grunt-contrib-compress version ==="
                  node -e "try { console.log(require('./node_modules/grunt-contrib-compress/package.json').version) } catch(e) { console.log('Not found:', e.message) }"
                  echo ""
                  echo "=== archiver version ==="
                  node -e "try { console.log(require('./node_modules/archiver/package.json').version) } catch(e) { console.log('Not found:', e.message) }"
                  echo ""
                  echo "=== Windows OS Info ==="
                  Get-ComputerInfo | Select-Object WindowsVersion, WindowsBuildLabEx, OsArchitecture
                  echo ""
                  echo "============================================"
                  echo "=== END DEBUG INFO ==="
                  echo "============================================"

            - name: 'Grunt'
              env:
                  NODE_OPTIONS: ''
              run: |
                  grunt desktop-win32 --skip-sign --verbose

            - name: 'Upload x64 exe artifact'
              uses: actions/upload-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.win.x64.exe
                  path: dist/desktop/KeeWeb-${{ steps.get_tag.outputs.tag }}.win.x64.exe

    # #
    #   Job › Create GitHub Release
    # #

    publish:
        runs-on: ubuntu-latest
        needs:
            - darwin
            - win32
        steps:
            - name: 'Get current git tag'
              id: get_tag
              uses: keeweb/get-git-tag@v3.0.2
              with:
                  tagRegex: "^v(\\d+\\.\\d+\\.\\d+)$"
                  tagRegexGroup: 1

            - name: 'Download darwin.arm64.dmg artifact'
              uses: actions/download-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.mac.arm64.dmg
                  path: assets

            - name: 'Download win32.x64.exe artifact'
              uses: actions/download-artifact@v4
              with:
                  name: KeeWeb-${{ steps.get_tag.outputs.tag }}.win.x64.exe
                  path: assets

            - name: 'Publish GitHub release'
              uses: softprops/action-gh-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: v${{ steps.get_tag.outputs.tag }}
                  name: Desktop apps v${{ steps.get_tag.outputs.tag }}
                  files: assets/*
                  body: |
                      ## Custom Build
                      This is a custom build with the Last-Modified header check removed for WebDAV compatibility.

                      ### Downloads
                      - Windows x64: `KeeWeb-${{ steps.get_tag.outputs.tag }}.win.x64.exe`
                      - macOS arm64: `KeeWeb-${{ steps.get_tag.outputs.tag }}.mac.arm64.dmg`
